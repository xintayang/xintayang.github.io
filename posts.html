<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts | Xinta Yang</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        #posts-container {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            column-gap: 2rem;
            row-gap: 0;
            grid-auto-rows: 1px;
            align-items: start;
        }

        @media (min-width: 768px) {
            #posts-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1280px) {
            #posts-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .post-card {
            background: white;
            padding: 2.5rem;
            border-radius: 1.5rem;
            border: 1px solid #f3f4f6;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.5s ease;
            overflow: hidden;
            opacity: 0;
            display: block;
            width: 100%;
        }

        .post-card.is-visible {
            opacity: 1;
        }

        .post-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .tag-pill {
            background: rgba(253, 196, 53, 0.12);
            color: #D9A31A;
        }

        .dropdown-accent-shadow {
            box-shadow:
                    0 20px 25px -5px rgba(0, 0, 0, 0.1),
                    0 8px 10px -6px rgba(0, 0, 0, 0.1),
                    0 20px 50px -12px rgba(217, 163, 26, 0.25);
        }

        #tags-dropdown {
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform-origin: top center;
        }
        #tags-dropdown.hidden {
            display: none;
        }
    </style>
</head>
<body class="bg-[#F5F5F4] font-sans text-[#25282B] min-h-screen p-6 md:p-20">

<div class="max-w-7xl mx-auto mb-12 flex flex-col md:flex-row md:items-end justify-between gap-6">
    <header class="text-center md:text-left">
        <a href="index.html"
           onclick="if(history.length > 1) { history.back(); return false; }"
           class="text-[#D9A31A] font-bold hover:opacity-80 transition-opacity">
            ← Back to Homepage
        </a>
        <h1 class="font-serif font-normal text-5xl mt-4 tracking-tight">Post Archive</h1>
    </header>

    <div class="relative z-50 w-full md:w-80">
        <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none z-10">
                <i data-lucide="search" class="h-5 w-5 text-gray-400 group-focus-within:text-[#D9A31A] transition-colors"></i>
            </div>
            <input
                    type="text"
                    id="tag-search-input"
                    placeholder="Filter by tag..."
                    class="w-full pl-12 pr-4 py-3 bg-white/60 backdrop-blur-md border border-white/50 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-[#D9A31A]/50 focus:bg-white/80 transition-all duration-300 cursor-pointer placeholder-gray-400 hover:placeholder-gray-600 text-gray-800 relative z-0"
                    autocomplete="off"
                    readonly
            >
            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none z-10">
                <i data-lucide="chevron-down" class="h-4 w-4 text-gray-400 group-hover:text-gray-600 transition-colors"></i>
            </div>
        </div>
        <div id="tags-dropdown" class="hidden absolute top-full left-0 right-0 mt-2 bg-white/90 backdrop-blur-xl rounded-xl dropdown-accent-shadow border border-white/50 overflow-hidden max-h-60 overflow-y-auto"></div>
    </div>
</div>

<div id="posts-container" class="max-w-7xl mx-auto relative"></div>

<script>
    const POSTS_DIRECTORY = '/posts/';
    const postFiles = ['group-contagion.md'];

    let allPostsData = [];
    let allTags = new Set();
    let currentFilter = 'All Posts';

    const masonryObserver = new ResizeObserver(entries => {
        for (let entry of entries) {
            const item = entry.target;
            const contentHeight = item.firstElementChild.getBoundingClientRect().height;
            const cardPadding = 80;
            const visualGap = 32;
            const rowSpan = Math.ceil(contentHeight + cardPadding + visualGap);
            item.style.gridRowEnd = `span ${rowSpan}`;
            item.classList.add('is-visible');
        }
    });

    async function init() {
        const container = document.getElementById('posts-container');
        for (const fileName of postFiles) {
            try {
                const response = await fetch(POSTS_DIRECTORY + fileName);
                if (!response.ok) throw new Error(`Could not fetch ${fileName}`);
                const text = await response.text();

                // Standard fields
                const title = (text.match(/title:\s*(.*)/)?.[1] || "Untitled").replace(/['"]/g, '');
                const date = text.match(/date:\s*([\d-]+)/)?.[1] || "No Date";
                const excerpt = text.match(/excerpt:\s*([\s\S]*?)(?=\n\S|---)/)?.[1]?.trim() || "No excerpt available.";

                // --- FIX STARTS HERE ---

                // Old Regex (Buggy): /(?=\n\S|---)/ stopped at hyphens.
                // New Regex: Stops only at lines starting with a Key (Word:) or End of Block (---)
                const tagsBlockMatch = text.match(/tags:\s*([\s\S]*?)(?=\n\s*[a-zA-Z0-9_-]+:|---)/);

                let tags = [];
                if (tagsBlockMatch) {
                    tags = tagsBlockMatch[1].split('\n')
                        .map(l => l.trim())
                        .filter(l => l.startsWith('-'))         // Find lines starting with "-"
                        .map(l => l.replace(/^-\s*/, '').trim()); // Cleanly remove the "-" and spaces
                }
                // --- FIX ENDS HERE ---

                tags.forEach(t => allTags.add(t));

                allPostsData.push({
                    fileName,
                    title,
                    date,
                    excerpt,
                    tags
                });

            } catch (e) {
                console.error("Error loading post:", fileName, e);
            }
        }

        populateTagsDropdown();
        renderPosts(allPostsData);
        lucide.createIcons();
    }

    function renderPosts(postsToRender) {
        const container = document.getElementById('posts-container');
        container.innerHTML = '';

        if (postsToRender.length === 0) {
            container.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10">No posts found.</div>`;
            return;
        }

        postsToRender.forEach(post => {
            const card = document.createElement('div');
            card.className = 'post-card';
            card.onclick = () => window.location.href = `post-detail.html?post=${post.fileName}`;

            card.innerHTML = `
            <div class="card-inner">
                <h2 class="font-serif font-normal text-2xl mb-2 leading-tight">${post.title}</h2>
                <p class="text-[10px] text-gray-400 font-extrabold uppercase tracking-widest mb-4">${post.date}</p>
                <p class="text-gray-600 leading-relaxed text-sm mb-6">${post.excerpt}</p>
                <div class="flex justify-end items-center gap-2">
                    <div class="flex flex-wrap gap-2">
                        ${post.tags.map(t => `<span class="tag-pill text-[9px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">${t}</span>`).join('')}
                    </div>
                </div>
            </div>
            `;

            container.appendChild(card);
            masonryObserver.observe(card);
        });

        lucide.createIcons();
    }

    function populateTagsDropdown() {
        const dropdown = document.getElementById('tags-dropdown');
        const input = document.getElementById('tag-search-input');

        dropdown.innerHTML = '';

        const allOption = createDropdownItem('All Posts');
        allOption.onclick = () => filterByTag('All Posts');
        dropdown.appendChild(allOption);

        Array.from(allTags).sort().forEach(tag => {
            const item = createDropdownItem(tag);
            item.onclick = () => filterByTag(tag);
            dropdown.appendChild(item);
        });

        input.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!input.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });
    }

    function createDropdownItem(text) {
        const div = document.createElement('div');
        div.className = 'px-5 py-3 hover:bg-[#D9A31A]/10 cursor-pointer text-sm text-gray-700 font-medium border-b border-gray-100/50 last:border-0 transition-colors flex items-center justify-between group';
        div.innerHTML = `
            <span>${text}</span>
            <i data-lucide="arrow-right" class="w-4 h-4 text-[#D9A31A] opacity-0 group-hover:opacity-100 transition-opacity -translate-x-2 group-hover:translate-x-0 transition-transform"></i>
        `;
        return div;
    }

    function filterByTag(tag) {
        const input = document.getElementById('tag-search-input');
        const dropdown = document.getElementById('tags-dropdown');

        currentFilter = tag;
        input.value = '';
        dropdown.classList.add('hidden');

        if (tag === 'All Posts') {
            renderPosts(allPostsData);
        } else {
            const filtered = allPostsData.filter(p => p.tags.includes(tag));
            renderPosts(filtered);
        }
    }

    lucide.createIcons();
    init();
</script>
</body>
</html>
